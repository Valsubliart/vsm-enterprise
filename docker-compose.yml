services:

  app:
    build:
      context: ./docker/php
    container_name: vsm_app
    volumes:
      - ./backend:/var/www/html
    networks:
      - vsm_network
    depends_on:
      - database
      - redis


  nginx:
    image: nginx:latest
    container_name: vsm_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - vsm_network


  database:
    image: mariadb:11
    container_name: vsm_database
    restart: always
    environment:
      MYSQL_DATABASE: vsm_enterprise
      MYSQL_USER: vsm_user
      MYSQL_PASSWORD: vsm_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - vsm_network


  redis:
    image: redis:latest
    container_name: vsm_redis
    ports:
      - "6379:6379"
    networks:
      - vsm_network


networks:

  vsm_network:


volumes:

  mariadb_data:services:

